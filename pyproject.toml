[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-epic-bridge"
version = "0.2.0"
description = "Synchronize your entire Epic Games Store library into Steam with automatic cover art."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "vdf>=3.4",
    "click>=8.1",
    "rich>=13.0",
    "psutil>=5.9",
    "Pillow>=10.0",
    "legendary-gl>=0.20.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.scripts]
seb = "steam_epic_bridge.cli:cli"

[tool.setuptools.packages.find]
include = ["steam_epic_bridge*"]
